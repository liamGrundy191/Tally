name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The deploy runs these checks first (deploy.yml).
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The database tests (apps/api) each use their own empty schema in this throwaway database.
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally-ci-only
          POSTGRES_DB: tally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tally -d tally"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tally:tally-ci-only@localhost:5432/tally
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: tally
      S3_SECRET_ACCESS_KEY: tally-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # File storage for the upload tests (apps/api), each in its own bucket. A step, not a service:
      # the MinIO image needs its "server" arguments (D40).
      - name: Start MinIO
        run: |
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER=tally -e MINIO_ROOT_PASSWORD=tally-ci-only \
            chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec \
            server /data
          for i in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @tally/web build
      # pnpm dev runs the API from this build (D47); keeps it from breaking unnoticed.
      - run: pnpm --filter @tally/api exec tsc -p tsconfig.build.json
      # The browser test (T2.3): its own database tally_e2e and bucket, three tickets reviewed by keyboard.
      - run: pnpm --filter @tally/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm audit --prod --audit-level high

  # The production images (T4.3, D60): they build, hold no private files, run as non-root, and the
  # rehearsal stack answers through Caddy with its security headers.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCAL: docker compose -p tally-local -f docker/compose.prod.yml -f docker/compose.local.yml --env-file docker/local.env
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/app.Dockerfile -t tally-app:local .
      - run: docker build -f docker/web.Dockerfile -t tally-web:local .
      - run: sh docker/scan-image.sh tally-app:local /app && sh docker/scan-image.sh tally-web:local /srv
      - name: Not root, and poppler is there
        run: |
          [ "$(docker run --rm tally-app:local id -u)" != 0 ]
          [ "$(docker run --rm --entrypoint id tally-web:local -u)" != 0 ]
          docker run --rm tally-app:local pdftoppm -v
      - name: Start the rehearsal stack and migrate
        run: |
          $LOCAL up -d postgres minio minio-setup
          $LOCAL run --rm -w /app/apps/api api ./node_modules/.bin/prisma migrate deploy
          $LOCAL up -d --wait api worker web
      - name: Health, redirect and headers through Caddy
        run: sh docker/check-local.sh
      - if: failure()
        run: $LOCAL logs --no-color
