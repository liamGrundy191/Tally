# Deploys a release to the server (PLAN section 12, T4.3, D60). Runs when a tag like v1.0.0 is
# pushed, or by hand from the Actions tab: "Run workflow", choosing a tag under "Use workflow
# from" (a redeploy, or a rollback to an earlier tag). The checks must pass first. The images are
# built here and copied to the server over SSH; the settings and secrets never leave the server.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: deploy

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key and the server's pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Build the images
        run: |
          docker build -f docker/app.Dockerfile -t "tally-app:$TAG" .
          docker build -f docker/web.Dockerfile -t "tally-web:$TAG" .
          sh docker/scan-image.sh "tally-app:$TAG" /app
          sh docker/scan-image.sh "tally-web:$TAG" /srv
      - name: Copy them to the server
        run: |
          docker save "tally-app:$TAG" "tally-web:$TAG" | gzip | ssh "$SERVER" 'gunzip | docker load'
          scp docker/compose.prod.yml "$SERVER:/opt/tally/compose.yml"
      # A failed migration stops here: the release that is running keeps running.
      - name: Migrate, then start the new release
        run: |
          ssh "$SERVER" "set -e; cd /opt/tally
            sed -i 's/^TALLY_VERSION=.*/TALLY_VERSION=$TAG/' .env
            docker compose run --rm -w /app/apps/api api ./node_modules/.bin/prisma migrate deploy
            docker compose up -d --remove-orphans
            for repo in tally-app tally-web; do
              docker image ls \$repo --format '{{.Tag}}' | sort -rV | tail -n +4 | xargs -r -I{} docker image rm \$repo:{}
            done"
      - name: Wait until the site answers
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -fsS "${{ vars.APP_URL }}/api/health" || true)" = ok ] && exit 0
            sleep 10
          done
          echo "The site did not answer ok within 5 minutes."; exit 1
