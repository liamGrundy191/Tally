# Local development only: Postgres and S3-compatible file storage (MinIO).
# docker compose -f docker/compose.dev.yml up -d
# The passwords below are for this local setup only; production uses managed Postgres and AWS S3.
name: tally-dev

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally-dev-only
      POSTGRES_DB: tally
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tally -d tally']
      interval: 5s
      retries: 10

  minio:
    # MinIO no longer publishes free images; this is Chainguard's build of it, pinned by digest (D40).
    image: chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: tally
      MINIO_ROOT_PASSWORD: tally-dev-only
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio:/data

  # Runs once and stops: creates the `tally` bucket the app uses (S3_BUCKET=tally in .env).
  minio-setup:
    image: chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    entrypoint: ['sh', '-c', 'until mc ready l; do sleep 1; done; mc mb --ignore-existing l/tally']
    environment:
      MC_HOST_l: 'http://tally:tally-dev-only@minio:9000'
    depends_on:
      - minio
    restart: 'no'

volumes:
  postgres:
  minio:
